name: Build & Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

  build-windows:
    name: Windows (.exe)
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyinstaller -r requirements.txt

      - name: Build
        run: pyinstaller dnd_healthbar_public.spec --clean --noconfirm

      - uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: dist/DnD_HealthBar_Public.exe

  build-linux:
    name: Linux (binary)
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libappindicator3-dev gir1.2-appindicator3-0.1

      - name: Install Python dependencies
        run: pip install pyinstaller -r requirements.txt

      - name: Build
        run: pyinstaller dnd_healthbar_public.spec --clean --noconfirm

      - uses: actions/upload-artifact@v7
        with:
          name: linux-binary
          path: dist/DnD_HealthBar_Public

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: windows-exe
          path: release/

      - uses: actions/download-artifact@v8
        with:
          name: linux-binary
          path: release/

      - name: Make Linux binary executable
        run: chmod +x release/DnD_HealthBar_Public

      - name: Release notes from CHANGELOG.md
        run: |
          python3 .github/scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v3
        with:
          name: D&D Health Bar ${{ github.ref_name }}
          body_path: notes.md
          files: |
            release/DnD_HealthBar_Public.exe
            release/DnD_HealthBar_Public
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
